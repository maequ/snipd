<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snipd pin</title>
    <style>
      /*
       * A pinned capture. The window has no decorations, so the image itself is
       * the drag handle and the only chrome is a close button that stays out of
       * the way until the pointer is over the window.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #121214;
        user-select: none;
        -webkit-user-select: none;
      }

      #shot {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        cursor: move;
        -webkit-user-drag: none;
      }

      #close {
        position: fixed;
        top: 6px;
        right: 6px;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #1a1a1e;
        border: 1px solid #2d2d34;
        color: #fff;
        cursor: pointer;
        opacity: 0;
        transition: opacity 120ms ease;
      }

      /* Revealed on hover so the pin is unobtrusive while being referenced. */
      body:hover #close {
        opacity: 1;
      }

      /* Pure white on hover: the app has no colour accent, and a pin needs its
         close control to read over whatever image is underneath. */
      #close:hover {
        background: #ffffff;
        color: #121214;
      }

      #error {
        display: none;
        padding: 16px;
        font: 12px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        color: #e8918f;
      }
    </style>
  </head>

  <body>
    <img id="shot" alt="" data-tauri-drag-region />
    <button id="close" type="button" title="Close pin" aria-label="Close pin">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
    <p id="error"></p>
    <script type="module" src="/src/pin.ts"></script>
  </body>
</html>
