[package]
name = "snipd"
version = "0.1.0"
description = "A screenshot tool for Windows that never loses a capture"
authors = ["Snipd Contributors"]
license = "MIT"
repository = "https://github.com/snipd-app/snipd"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snipd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` keeps the app resident and usable with no window open;
# `image-png` lets the tray icon be loaded from the existing PNG assets.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"

# System-wide capture shortcuts that work regardless of which app has focus.
tauri-plugin-global-shortcut = "2"

# Only one Snipd at a time. A second copy cannot register the global shortcuts
# the first already owns, which surfaces as a pile of confusing
# "HotKey already registered" warnings rather than anything actionable.
tauri-plugin-single-instance = "2"

# Native folder picker for the save-location setting.
tauri-plugin-dialog = "2"

# "Screenshot saved" toasts. Native notifications rather than an in-app banner,
# because most captures happen by shortcut with no Snipd window on screen.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image encoding. Only the two formats the app offers are compiled in, which
# keeps the binary meaningfully smaller than the crate's default feature set.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Capture timestamps and filename formatting.
chrono = "0.4"

# Resolves the Windows known folders (Pictures, AppData) properly, rather than
# assuming a path under the user profile.
dirs = "6"

# Clipboard image support.
arboard = "3"

thiserror = "2"

# The editor hands back a finished PNG. Base64 over the IPC bridge is ~1.33x the
# raw size; a Vec<u8> parameter would be serialised as a JSON array of numbers,
# which is roughly 4x and markedly slower to parse.
base64 = "0.22"

# Direct Win32 access for the capture backend. See src/capture/win.rs for why
# this is preferred over a cross-platform capture crate.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    # Media Foundation supplies the H.264 encoder and MP4 muxer that ship with
    # Windows, so recording needs no bundled ffmpeg and no extra licensing.
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
]

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
