# Build and publish a release.
#
# Triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.
# Produces the standalone executable and the Inno Setup installer, and attaches
# both to a GitHub Release — which is what the README tells people to download.

name: Release

on:
  push:
    tags: ["v*"]
  # Lets a release be produced without tagging, for testing the workflow itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the application
        run: npm run tauri build -- --no-bundle

      # Not preinstalled on the runner. Inno Setup is what builds the wizard
      # that collects first-run settings, so the installer cannot be produced
      # without it.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Looked up rather than hard-coded. `$env:ProgramFiles(x86)` does not work:
      # PowerShell reads it as `$env:ProgramFiles` followed by a literal
      # "(x86)", producing a path that does not exist. The brace form is
      # required, and checking both Program Files roots survives Inno Setup
      # being installed as either architecture.
      - name: Build the installer
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe not found. Looked in: $($candidates -join ', ')"
          }
          Write-Host "Using $iscc"
          & $iscc installer\snipd.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      # Notes come from CHANGELOG.md, not from commit subjects.
      #
      # This step fails when the tag has no section in the changelog, and that
      # is deliberate: a release going out with no description of what changed
      # should stop the build rather than quietly publish boilerplate.
      - name: Collect the release notes
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          node scripts/release-notes.mjs "$tag" > release-notes.md
          echo "--- notes for $tag ---"
          cat release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/Snipd-Setup-*.exe
            src-tauri/target/release/snipd.exe
          # Published, not drafted. A draft is invisible to everyone but the
          # repository owner, so tagging a version would leave the README
          # pointing at an empty Releases page.
          draft: false
          body_path: release-notes.md
